<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Validation Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <h2>Registration Form</h2>

    <form id="myForm">
        <!-- Name -->
        <label>Name</label>
        <input type="text" id="name" maxlength="20">
        <span class="error-msg" id="nameError"></span>

        <!-- Age -->
        <label>Age</label>
        <input type="number" id="age">
        <span class="error-msg" id="ageError"></span>

        <!-- Gender -->
        <label>Gender</label>
        <div class="gender">
            <input type="radio" name="gender" value="Male"> Male
            <input type="radio" name="gender" value="Female"> Female
        </div>
        <span class="error-msg" id="genderError"></span>

        <!-- Email -->
        <label>Email</label>
        <input type="email" id="email" maxlength="30">
        <span class="error-msg" id="emailError"></span>

        <!-- Password -->
        <label>Password</label>
        <input type="password" id="password" maxlength="12">
        <span class="error-msg" id="passwordError"></span>

        <!-- Phone -->
        <label>Phone Number</label>
        <input type="text" id="phone" maxlength="10">
        <span class="error-msg" id="phoneError"></span>

        <!-- Address -->
        <label>Address</label>
        <textarea id="address" maxlength="50"></textarea>
        <span class="error-msg" id="addressError"></span>

        <!-- Terms -->
        <label class="terms">
            <input type="checkbox" id="terms"> I agree to Terms & Conditions
        </label>
        <span class="error-msg" id="termsError"></span>

        <button type="submit">Submit</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
